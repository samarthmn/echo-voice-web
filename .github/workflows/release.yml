name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  release:
    name: Build, check and publish
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep temporary files in the checkout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          printf 'TMPDIR=%s/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: The tag must match the version in Cargo.toml
        run: |
          version="$(node scripts/version.ts)"
          node scripts/version.ts --check
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version." >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Matches rust-toolchain.toml.
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          version="$(awk '/name = "wasm-bindgen"/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }},cargo-deny@0.20.2
      - run: ./scripts/setup.sh
      - run: pnpm exec playwright install chromium
      - name: Checks
        env:
          CI: '1'
        run: |
          ./scripts/check.sh --rust
          ./scripts/check.sh --app
      - name: Package the extension
        run: |
          pnpm package:extension
          node scripts/package-extension.ts --store
          cd dist
          shasum -a 256 echo-extension-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > tmp/release-notes.md
          if [[ ! -s tmp/release-notes.md ]]; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Echo $VERSION" \
            --notes-file tmp/release-notes.md \
            dist/echo-extension-"$VERSION".zip \
            dist/echo-extension-store-"$VERSION".zip \
            dist/SHA256SUMS.txt

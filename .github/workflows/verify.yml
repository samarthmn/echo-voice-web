name: Verify Echo Voice

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic locations while compiling and caching far less debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The three jobs run in parallel; together they cover ./scripts/check.sh --all.
jobs:
  rust:
    name: Rust lint and tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep temporary files in the checkout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          printf 'TMPDIR=%s/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Matches rust-toolchain.toml.
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Failed runs still warm the cache, so the next run skips dependency builds.
          cache-on-failure: true
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-deny@0.20.2
      - run: ./scripts/check.sh --rust

  app:
    name: App build and browser tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep temporary files in the checkout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          printf 'TMPDIR=%s/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Matches rust-toolchain.toml.
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          version="$(awk '/name = "wasm-bindgen"/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      # A prebuilt binary instead of compiling wasm-bindgen-cli in setup.sh.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - run: ./scripts/setup.sh
      - run: pnpm exec playwright install chromium
      - run: ./scripts/check.sh --app

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep temporary files in the checkout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          printf 'TMPDIR=%s/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production npm dependencies
        run: pnpm audit --prod
      - name: Install actionlint 1.7.12
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s/bin\n' "$(go env GOPATH)" >> "$GITHUB_PATH"
      - name: Verify preinstalled ShellCheck
        run: shellcheck --version
      - run: ./scripts/check.sh --lint

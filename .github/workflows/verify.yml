name: Verify Echo Voice

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test local workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      ECHO_TEST_BINARY: target/release/echo-server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Keep verification scratch in the checkout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          printf 'TMPDIR=%s/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The build script runs npm ci --ignore-scripts and installs the matching
      # wasm-bindgen CLI from Cargo.lock before building browser and server assets.
      - name: Build browser assets and release server
        run: bash scripts/build.sh

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Select the installed Chromium executable
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_PATH=${chromium.executablePath()}\n`);
          JS

      - name: Test Rust server
        run: cargo test --locked -p echo-server

      - name: Check Rust formatting and server lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p echo-server --all-targets -- -D warnings

      - name: Validate managed config with the real pinned Codex helper
        run: node scripts/smoke-codex.mjs

      - name: Test browser modules and REST lifecycle
        run: npm test

      - name: Test AMI score provenance and numerical reproduction
        run: python3 -B tests/ami_score_test.py

      - name: Test native speech API
        env:
          ECHO_TEST_BINARY: target/release/echo-server
        run: |
          # Exercise the built release executable, including when debug output was cached.
          rm -f target/debug/echo-server
          python3 -B -m unittest discover -s tests -p 'native_speech_http_test.py' -v

      - name: Test extension capture, recovery and authorization
        run: npm run test:extension

      - name: Test browser workflows and accessibility
        run: |
          # A cached debug executable must not hide tests ignoring ECHO_TEST_BINARY.
          rm -f target/debug/echo-server
          npm run test:e2e

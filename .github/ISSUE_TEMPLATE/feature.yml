name: Feature request
description: Suggest an improvement to Echo.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Echo stays local and single-user: ideas that need an account, a hosted server, or sending meeting data off the Mac are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where Echo falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps all meeting data on the user's Mac.
          required: true

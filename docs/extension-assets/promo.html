<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440,initial-scale=1">
  <title>Echo Meeting Recorder — promotional tile</title>
  <link rel="stylesheet" href="../../public/design-tokens.css">
  <link rel="stylesheet" href="../../public/fonts/inter.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body { position: relative; padding: 25px 28px; background: var(--canvas); color: var(--ink); }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand img { width: 44px; height: 44px; }
    .name { font-size: 25px; font-weight: 600; letter-spacing: -.9px; }
    .kind { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    h1 { position: relative; margin: 23px 0 11px; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -1.4px; }
    h1 span { color: var(--accent-text); }
    .benefit { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
    .requirement { position: absolute; left: 28px; bottom: 20px; margin: 0; font-size: 10px; line-height: 1.4; color: var(--muted); }
    .echo { position: absolute; right: -26px; top: 66px; width: 180px; height: 180px; border: 1px solid var(--line); border-radius: 50%; }
    .echo::before, .echo::after { content: ''; position: absolute; border: 1px solid var(--line); border-radius: 50%; }
    .echo::before { inset: 21px; }
    .echo::after { inset: 43px; background: var(--purple-soft); opacity: .55; }
  </style>
</head>
<body>
  <div class="echo" aria-hidden="true"></div>
  <div class="brand"><img src="../../public/favicon.svg" alt=""><div><div class="name">Echo</div><p class="kind">Meeting Recorder</p></div></div>
  <h1>Record meetings.<br><span>Review locally.</span></h1>
  <p class="benefit">Browser audio. Your local Echo library.</p>
  <p class="requirement">Echo desktop app required for transcripts and notes.</p>
</body>
</html>

[workspace]
members = ["app", "server", "desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Proc-macro dylibs execute on the build host; stripping can invalidate their
# Mach-O load commands on newer macOS. Shipped runtime binaries stay stripped.
[profile.release.build-override]
strip = false

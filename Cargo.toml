[workspace]
members = ["app", "server"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow" # Module context already distinguishes internal types and helpers.
wildcard_imports = "allow" # Dioxus preludes and private submodules intentionally share their parent scope.
must_use_candidate = "allow" # Internal application helpers do not need pervasive must_use annotations.
missing_errors_doc = "allow" # These binary crates have no public library API to document.
missing_panics_doc = "allow" # Test assertions and internal invariants do not need public API documentation.
too_many_lines = "allow" # Dioxus components and sequential request handlers benefit from staying together.

# Debug builds (dev.sh and the integration tests) are lightly optimized and optimize
# dependencies fully: unoptimized AES-GCM, SQLCipher and JSON make encrypted audio,
# export and import several times slower.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

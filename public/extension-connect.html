<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Connect this browser · Echo</title>
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/extension-connect.css" />
    <script type="module" src="/js/extension-connect.js"></script>
  </head>
  <body>
    <main class="extension-connection">
      <a class="connection-brand" href="/"
        ><img src="/favicon.svg" width="38" height="38" alt="" />Echo</a
      >
      <section class="connection-card">
        <p class="eyebrow">BROWSER CONNECTION</p>
        <h1 id="connection-heading">Allow this browser to send recordings to Echo?</h1>
        <p id="browser-name"></p>
        <p id="browser-origin"></p>
        <p id="status" role="status">Checking this connection request…</p>
        <p id="error" role="alert" hidden></p>
        <div id="approval-actions" class="connection-actions" hidden>
          <button id="approve" class="button button-primary">Allow</button>
          <button id="reject" class="button button-secondary">Don't allow</button>
        </div>
        <button id="retry" class="button button-secondary" hidden>Try again</button>
        <a id="back-to-echo" class="connection-back" href="/" hidden>Back to Echo</a>
      </section>
    </main>
  </body>
</html>

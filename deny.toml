# cargo-deny: run `cargo deny check` (CI runs it on every push).
[graph]
all-features = true

[advisories]
# Fail on any RustSec vulnerability or unsound advisory; yanked crates fail too.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences compatible with Echo's MIT licence.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The SQLCipher amalgamation bundled for the encrypted library. SQLite itself is
# public domain ("blessing") and libtomcrypt is WTFPL/public domain; both are more
# permissive than MIT. Scoped to this crate so neither licence is allowed elsewhere.
exceptions = [
  { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
